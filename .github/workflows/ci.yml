name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-auth-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'nox-auth-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs

  auth:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Auth / ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26.0"
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Format, dependencies, vet, race tests and actual binary
        run: sh scripts/check.sh
      - name: Linux deployment targets
        if: runner.os == 'Linux' && matrix.go == '1.26.0'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o bin/nox-auth-linux-amd64 ./cmd/nox-auth
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -o bin/nox-auth-linux-arm64 ./cmd/nox-auth

  image:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Packaged Auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: docker build --build-arg VERSION=ci-validation -t nox-auth:ci .
      - run: python3 scripts/check-image.py --image nox-auth:ci --version ci-validation

  formatting:
    name: Formatting
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run test:format

  approved:
    name: CI approved
    needs: [plan, policy, auth, image, formatting]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
